name: codifyiq_core_components_example
description: Example app demonstrating widgets from codifyiq_core_components.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  codifyiq_core_components:
    path: ../
  flyer_chat_video_message:
    path: ./flyer_chat_video_message
  flutter_chat_core: ^2.9.0
  provider: ^6.1.5+1
  video_player: ^2.9.2
  adaptive_theme: ^3.7.0
  go_router: ^17.1.0
  flutter_chat_ui: ^2.11.0
  flutter_chat_core: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
