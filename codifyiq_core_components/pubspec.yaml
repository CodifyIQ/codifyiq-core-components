name: codifyiq_core_components
description: "Reusable Material 3 Flutter widgets — brightness toggle, notification center, AI progress indicator, error retry, social sign-in, and terms acceptance."
version: 0.7.0
homepage: https://github.com/CodifyIQ/codifyiq-core-components
repository: https://github.com/CodifyIQ/codifyiq-core-components
issue_tracker: https://github.com/CodifyIQ/codifyiq-core-components/issues
topics:
  - widgets
  - ui
  - material-design
  - notifications
  - components

flutter:
  uses-material-design: true

environment:
  sdk: ^3.10.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  gpt_markdown: ^1.1.5
  adaptive_theme: ^3.7.0
  shimmer: ^3.0.0
  pdfrx: ^2.3.3
  # Pinned to the flutter_chat_ui v1 line: v2 dropped flutter_chat_types,
  # which the AI chat message mapping depends on.
  flutter_chat_ui: ^1.6.15
  flutter_chat_types: ^3.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
