name: codifyiq_core_components
description: "Contains commonly used functional widgets.  CodifyIQ is open sourcing these for easy licensing and usage via standard pub mechanisms."
version: 0.8.0
homepage: https://github.com/CodifyIQ/codifyiq-core-components

flutter:
  uses-material-design: true
  assets:
    - example/assets/images/

environment:
  sdk: ^3.9.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  gpt_markdown: ^1.1.5
  adaptive_theme: ^3.7.0
  shimmer: ^3.0.0
  flutter_chat_ui: ^2.9.0
  flutter_chat_core: ^2.8.0
  flyer_chat_text_message: ^2.5.1
  cross_cache: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_svg: ^2.1.0
  go_router: ^17.1.0