name: codifyiq_core_components
description: "Reusable Material 3 Flutter widgets — brightness toggle, notification center, AI progress indicator, error retry, social sign-in, and terms acceptance."
version: 0.7.0
homepage: https://github.com/CodifyIQ/codifyiq-core-components
repository: https://github.com/CodifyIQ/codifyiq-core-components
issue_tracker: https://github.com/CodifyIQ/codifyiq-core-components/issues
topics:
  - widgets
  - ui
  - material-design
  - notifications
  - components

flutter:
  uses-material-design: true

environment:
  sdk: ^3.10.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  gpt_markdown: ^1.1.5
  adaptive_theme: ^3.7.0
  shimmer: ^3.0.0
  pdfrx: ^2.3.3
  flutter_chat_ui: ^2.0.0
  flutter_chat_core: ^2.0.0
  flyer_chat_text_message: ^2.0.0
  flyer_chat_image_message: ^2.0.0
  flyer_chat_file_message: ^2.0.0
  visibility_detector: ^0.4.0+2
  photo_view: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
