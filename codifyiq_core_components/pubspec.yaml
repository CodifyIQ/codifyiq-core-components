  gpt_markdown: ^1.1.5
  adaptive_theme: ^3.7.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  go_router: ^17.1.0